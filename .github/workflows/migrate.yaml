name: Migrate database

# Applies the migrations in supabase/migrations to the hosted Supabase project. Runs only when
# triggered by hand (Actions > Migrate database > Run workflow), and only from main, so unreviewed
# branches never touch the live database. It uses `supabase db push`, which applies pending
# migrations in order and never resets or reseeds the database. Do not swap it for `db reset`.
#
# Run it before publishing a release that needs a new migration, and once on a new project.
# Set the three secrets below first (Settings > Secrets and variables > Actions); the first step
# stops with a list of any that are missing.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list the migrations that would be applied; change nothing"
        required: false
        type: boolean
        default: false

# One migration run at a time, and never cancel one halfway through.
concurrency:
  group: migrate-database
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Check this run is on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Migrations can only be applied from main. Choose the main branch when you run this workflow."
          exit 1

      - name: Check the secrets are set
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Add these GitHub secrets, then run this workflow again:$missing"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned to match ci.yaml: `latest` calls the GitHub API every run and hits its rate limit.
          version: 2.118.0

      - name: Link to the Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: List pending migrations
        run: supabase db push --dry-run

      - name: Apply migrations
        if: inputs.dry_run != true
        run: supabase db push
