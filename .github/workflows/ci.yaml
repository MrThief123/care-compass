  docker-build-push:
    name: Build and Push Docker Image

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64

          # These variables are required by Next.js during
          # "npm run build" inside the Dockerfile.
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/care-compass:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/care-compass:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    needs: docker-build-push

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Start EC2 instance
        run: |
          aws ec2 start-instances \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}"

      - name: Wait for EC2 to start
        run: |
          echo "Waiting for EC2..."
          aws ec2 wait instance-running \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}"

          echo "EC2 is running."

      - name: Get EC2 public IP
        id: ec2
        run: |
          IP=$(aws ec2 describe-instances \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)

          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "EC2 IP: $IP"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/care-compass.pem
          chmod 600 ~/.ssh/care-compass.pem

      - name: Wait for SSH
        run: |
          echo "Waiting for SSH..."

          until ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=5 \
            -i ~/.ssh/care-compass.pem \
            "${{ secrets.EC2_SSH_USER }}@${{ steps.ec2.outputs.ip }}" \
            "echo SSH ready"
          do
            sleep 5
          done

      - name: Deploy Docker container
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i ~/.ssh/care-compass.pem \
            "${{ secrets.EC2_SSH_USER }}@${{ steps.ec2.outputs.ip }}" << 'EOF'

            set -e

            echo "Pulling latest Docker image..."
            docker pull mrthief123/care-compass:latest

            echo "Stopping old container..."
            docker stop care-compass || true

            echo "Removing old container..."
            docker rm care-compass || true

            echo "Starting new container..."
            docker run -d \
              --name care-compass \
              --restart unless-stopped \
              -p 8080:3000 \
              mrthief123/care-compass:latest

            echo "Deployment complete."
            docker ps

          EOF

  destroy:
    name: Stop EC2
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Stop EC2 instance
        run: |
          echo "Stopping EC2..."

          aws ec2 stop-instances \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}"

          echo "Waiting for EC2 to stop..."

          aws ec2 wait instance-stopped \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}"

          echo "EC2 stopped."