<h2>Reset your password</h2>
<p>We received a request to reset the password for your Care Compass account.</p>
<p>
  <a
    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
    >Choose a new password</a
  >
</p>
<p>
  This link works once and expires. If it has expired, request a new one from the sign-in page. If
  you did not ask for this, you can ignore this email.
</p>
